<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>憬悟智能 · 企业微信工作台</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --blue:#0071e3;--blue-weak:#eaf3fc;
  --bg:#f5f5f7;--card:#fff;--line:#e5e5ea;--hair:#ececf0;
  --text:#1d1d1f;--text2:#55575f;--text3:#8e8e93;
  --fill:#e9e9eb;--green:#34c759;--orange:#ff9500;--purple:#5e5ce6;
}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue","Segoe UI",sans-serif;background:linear-gradient(180deg,#fbfbfd 0%,#e9e9ee 100%);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:36px 20px;color:var(--text)}
/* ===== 桌面舞台 ===== */
.stage{display:flex;align-items:center;gap:44px;flex-wrap:wrap;justify-content:center}
.note{width:352px;max-width:100%}
.note .eyebrow{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:600;color:var(--blue);background:var(--blue-weak);padding:5px 14px;border-radius:980px}
.note .eyebrow svg{width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.note h1{font-size:27px;line-height:1.25;margin:15px 0 4px;letter-spacing:-.4px;font-weight:700}
.note h1 small{display:block;font-size:13px;font-weight:500;color:var(--text3);letter-spacing:0;margin-top:5px}
.note>p{font-size:13px;line-height:1.75;color:var(--text2);margin:10px 0 16px}
.kvs{border-radius:18px;background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.05);overflow:hidden}
.kv{display:flex;gap:12px;padding:12px 16px;font-size:12.5px;border-bottom:1px solid var(--hair)}
.kv:last-child{border-bottom:0}
.kv span{color:var(--text3);flex:none;width:62px}
.kv b{font-weight:600;color:var(--text)}
.wswitch{display:flex;align-items:center;gap:8px;margin-top:16px;flex-wrap:wrap}
.wswitch .lbl{font-size:11.5px;color:var(--text3)}
.wchips{display:flex;gap:6px}
.wchip{font-size:11.5px;color:var(--blue);background:var(--card);border:1px solid #d8d8dd;border-radius:980px;padding:5px 14px;cursor:pointer;font-family:inherit;transition:all .15s}
.wchip.on{color:#fff;background:var(--blue);border-color:var(--blue)}
.note .foot{margin-top:14px;font-size:11px;color:var(--text3);display:flex;align-items:center;gap:6px}
.note .foot svg{width:13px;height:13px;fill:none;stroke:var(--green);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
/* ===== 手机壳 ===== */
.device{width:395px;flex:none;background:#1d1d1f;border-radius:54px;padding:11px;box-shadow:0 38px 88px rgba(0,0,0,.32),0 4px 16px rgba(0,0,0,.14);transition:width .25s ease}
.disp{position:relative;width:375px;margin:0 auto;background:var(--bg);border-radius:44px;overflow:hidden;display:flex;flex-direction:column;height:772px;transition:width .25s ease}
.island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:102px;height:28px;background:#1d1d1f;border-radius:99px;z-index:60}
.status{display:flex;align-items:center;justify-content:space-between;padding:16px 28px 8px;font-size:13px;font-weight:600;color:#1d1d1f;flex:none;z-index:5}
.status .sic{display:flex;align-items:center;gap:5px}
.status svg{height:11px;fill:#1d1d1f}
.wxn{display:flex;align-items:center;background:rgba(255,255,255,.82);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-bottom:.5px solid var(--line);padding:8px 10px 8px 6px;flex:none;position:relative;z-index:5}
.wxn .bk{display:flex;align-items:center;color:var(--blue);font-size:13.5px;cursor:pointer;padding:4px 6px;border-radius:9px}
.wxn .bk:active{opacity:.5}
.wxn .bk svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;margin-right:2px}
.wxn .tt{position:absolute;left:60px;right:60px;text-align:center;font-size:15px;font-weight:600;pointer-events:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wxn .ops{margin-left:auto;display:flex;gap:13px;align-items:center;padding-right:5px}
.wxn .ops svg{width:5px;height:19px;fill:none;stroke:#3a3a3c;stroke-width:2.4;stroke-linecap:round}
/* ===== 应用区 ===== */
.app{flex:1;overflow-y:auto;overscroll-behavior:contain;position:relative;scrollbar-width:none}
.app::-webkit-scrollbar{display:none}
.view{display:none;min-height:100%}
.view.on{display:block}
/* —— 主页 —— */
.lgtitle{padding:16px 18px 4px}
.lgtitle h2{font-size:26px;font-weight:800;letter-spacing:-.4px}
.lgtitle p{font-size:12.5px;color:var(--text3);margin-top:4px}
.hcard{margin:14px 14px 0;border-radius:18px;padding:16px;display:flex;gap:12px;align-items:center}
.hcard.hblue{background:linear-gradient(135deg,#0a84ff 0%,#5e5ce6 100%);color:#fff}
.hcard .hi{width:44px;height:44px;border-radius:12px;background:rgba(255,255,255,.22);display:flex;align-items:center;justify-content:center;flex:none}
.hcard .hi svg{width:23px;height:23px;fill:none;stroke:#fff;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.hcard b{font-size:15.5px;font-weight:700;display:block}
.hcard p{font-size:11px;opacity:.85;margin-top:3px}
.hcard .go{margin-left:auto;flex:none;font-size:11.5px;font-weight:600;background:rgba(255,255,255,.92);color:#0a84ff;border-radius:980px;padding:7px 14px;cursor:pointer}
.hcard .go:active{opacity:.7}
.sect{display:flex;align-items:baseline;justify-content:space-between;padding:20px 18px 10px}
.sect b{font-size:19px;font-weight:700;letter-spacing:-.3px}
.sect i{font-style:normal;font-size:12.5px;color:var(--blue);cursor:pointer}
.agrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 14px}
.acard{background:var(--card);border-radius:18px;padding:14px;cursor:pointer;transition:transform .15s;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.acard:active{transform:scale(.97)}
.acard .ic{width:44px;height:44px;border-radius:11px;display:flex;align-items:center;justify-content:center;margin-bottom:10px}
.acard .ic svg{width:23px;height:23px;fill:none;stroke:#fff;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.acard b{font-size:13.5px;font-weight:600;display:block}
.acard p{font-size:10.5px;color:var(--text3);margin-top:3px;line-height:1.5}
.ovcard{margin:12px 14px 0;background:var(--card);border-radius:18px;padding:15px 8px;display:grid;grid-template-columns:repeat(3,1fr);box-shadow:0 1px 3px rgba(0,0,0,.04)}
.ov{text-align:center;padding:0 4px}
.ov b{font-size:21px;font-weight:800;letter-spacing:-.5px;color:var(--blue);font-variant-numeric:tabular-nums}
.ov b small{font-size:10.5px;font-weight:600;color:var(--text3);margin-left:1px}
.ov em{display:block;font-style:normal;font-size:10.5px;color:var(--text3);margin-top:3px}
.igroup{margin:12px 14px 0;background:var(--card);border-radius:14px;box-shadow:0 1px 3px rgba(0,0,0,.04);overflow:hidden}
.irow{display:flex;align-items:center;gap:11px;padding:11px 14px;border-bottom:.5px solid var(--hair);cursor:pointer}
.irow:last-child{border-bottom:0}
.irow:active{background:var(--fill)}
.irow .ic{width:29px;height:29px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex:none}
.irow .ic svg{width:16px;height:16px;fill:none;stroke:#fff;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.irow .lb{flex:1;font-size:13.5px}
.irow .vv{font-size:12px;color:var(--text3)}
.irow svg.ar{width:14px;height:14px;fill:none;stroke:#c7c7cc;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
/* —— 应用页 —— */
.arow{display:flex;align-items:center;gap:12px;margin:12px 14px 0;background:var(--card);border-radius:18px;padding:13px 14px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.arow .ic{width:50px;height:50px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex:none}
.arow .ic svg{width:26px;height:26px;fill:none;stroke:#fff;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.arow .md{flex:1;min-width:0}
.arow .nm{font-size:14.5px;font-weight:600}
.arow .ds{font-size:11px;color:var(--text3);margin-top:3px;line-height:1.45}
.arow .get{flex:none;font-size:12px;font-weight:700;color:#fff;background:var(--blue);border-radius:980px;padding:7px 16px;cursor:pointer}
.arow .get:active{opacity:.7}
.aend{text-align:center;font-size:10.5px;color:var(--text3);padding:20px 0 90px}
/* —— 通知 —— */
.nseg{display:flex;margin:14px 14px 0;background:var(--fill);border-radius:10px;padding:2px}
.nseg button{flex:1;font-family:inherit;font-size:12.5px;font-weight:600;padding:7px 0;border:0;border-radius:8px;background:transparent;color:var(--text2);cursor:pointer;transition:all .15s}
.nseg button.on{background:var(--card);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.nitem{display:flex;gap:11px;background:var(--card);border-radius:18px;margin:10px 14px 0;padding:13px 14px;align-items:flex-start;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.nitem .ic{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex:none}
.nitem .ic svg{width:20px;height:20px;fill:none;stroke:#fff;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.nitem .bd{flex:1;min-width:0}
.nitem .r1{display:flex;align-items:center;gap:7px}
.nitem .app{font-size:10.5px;color:var(--text3);flex:none}
.nitem .tt{font-size:13.5px;font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nitem .tm{font-size:10.5px;color:var(--text3);flex:none}
.nitem p{font-size:12px;color:var(--text2);line-height:1.55;margin-top:4px}
.nitem .go{display:inline-block;margin-top:8px;font-size:12px;font-weight:600;color:var(--blue);cursor:pointer}
.nend{text-align:center;font-size:10.5px;color:var(--text3);padding:18px 0 90px}
/* —— 我的 —— */
.me{padding:24px 18px 12px;display:flex;align-items:center;gap:14px}
.me .av{width:60px;height:60px;border-radius:50%;background:linear-gradient(135deg,#0a84ff,#5e5ce6);color:#fff;font-size:24px;font-weight:600;display:flex;align-items:center;justify-content:center;flex:none}
.me .nm{font-size:20px;font-weight:700;letter-spacing:-.3px}
.me .sub{font-size:12px;color:var(--text3);margin-top:4px}
.mend{text-align:center;font-size:10.5px;color:var(--text3);padding:18px 0 90px;line-height:1.9}
/* ===== 底部标签栏 ===== */
.tabbar{flex:none;display:flex;background:rgba(249,249,251,.9);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-top:.5px solid var(--line);padding:6px 0 calc(10px + env(safe-area-inset-bottom))}
.tabbar .tb{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;color:var(--text3);cursor:pointer;font-weight:500}
.tabbar .tb svg{width:25px;height:25px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tabbar .tb.on{color:var(--blue)}
/* ===== 悬浮问一问 ===== */
.fab{position:absolute;right:16px;bottom:76px;z-index:30;display:flex;align-items:center;gap:7px;background:var(--blue);color:#fff;font-size:13px;font-weight:600;border-radius:980px;padding:12px 18px;box-shadow:0 8px 22px rgba(0,113,227,.42);cursor:pointer;transition:transform .15s}
.fab:active{transform:scale(.94)}
.fab svg{width:17px;height:17px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
/* ===== 聊天页 ===== */
.chatpage{position:absolute;inset:0;background:var(--bg);display:none;flex-direction:column;z-index:40}
.chatpage.on{display:flex}
.chnav{flex:none;display:flex;align-items:center;background:rgba(249,249,251,.9);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-bottom:.5px solid var(--line);padding:8px 10px;gap:8px}
.chnav .bk{display:flex;align-items:center;cursor:pointer;color:var(--blue);padding:4px 6px;border-radius:9px}
.chnav .bk:active{opacity:.5}
.chnav .bk svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;margin-right:2px}
.chnav .ag{flex:1;min-width:0;text-align:center}
.chnav .ag b{font-size:14.5px;font-weight:600;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chnav .ag i{font-style:normal;font-size:10px;color:var(--text3);display:block;margin-top:1px}
.chnav .more{padding:4px 6px;cursor:pointer;color:#3a3a3c}
.chnav .more svg{width:5px;height:19px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;display:block}
.msgs{flex:1;overflow-y:auto;padding:16px 13px 12px;display:flex;flex-direction:column;gap:10px;scrollbar-width:none}
.msgs::-webkit-scrollbar{display:none}
.msg{display:flex;gap:8px;align-items:flex-end;max-width:100%}
.msg .av{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none;font-size:12px;font-weight:600;color:#fff}
.msg .av svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.msg .bd{min-width:0;max-width:calc(100% - 48px)}
.msg.me{flex-direction:row-reverse}
.msg.me .bd{display:flex;flex-direction:column;align-items:flex-end}
.msg.me p{background:var(--blue);color:#fff;border-radius:18px 18px 4px 18px}
.msg p{background:var(--fill);color:var(--text);border-radius:18px 18px 18px 4px;padding:10px 13px;font-size:13.5px;line-height:1.6;word-break:break-word}
.msg p b{color:var(--blue);font-weight:700}
.msg.me p b{color:#fff}
.msg p code{font-family:ui-monospace,Menlo,monospace;font-size:11.5px;background:rgba(0,0,0,.06);border-radius:5px;padding:1px 5px}
.msg.me p code{background:rgba(255,255,255,.2)}
.msg p ol,.msg p ul{margin:4px 0 2px;padding-left:19px;display:flex;flex-direction:column;gap:3px}
.srcs{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 0 38px}
.src{display:inline-flex;align-items:center;gap:5px;font-size:10px;color:var(--blue);background:var(--card);border:1px solid #d3e5f8;border-radius:980px;padding:4px 11px;cursor:pointer}
.src svg{width:11px;height:11px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.typing{display:inline-flex;gap:4px;padding:4px 2px}
.typing i{width:7px;height:7px;border-radius:50%;background:#8e8e93;animation:tp 1s infinite}
.typing i:nth-child(2){animation-delay:.16s}
.typing i:nth-child(3){animation-delay:.32s}
@keyframes tp{0%,60%,100%{transform:translateY(0);opacity:.4}30%{transform:translateY(-4px);opacity:1}}
.caret{display:inline-block;width:2px;height:15px;background:var(--blue);animation:blink .8s infinite;vertical-align:-2px;margin-left:2px;border-radius:1px}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
.quick{flex:none;display:flex;gap:8px;overflow-x:auto;padding:10px 13px 4px;scrollbar-width:none}
.quick::-webkit-scrollbar{display:none}
.qk{flex:none;font-size:12px;color:var(--blue);background:var(--card);border:1px solid #d3e5f8;border-radius:980px;padding:8px 14px;cursor:pointer}
.qk:active{background:var(--blue-weak)}
.cbar{flex:none;display:flex;align-items:center;gap:9px;background:rgba(249,249,251,.94);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-top:.5px solid var(--line);padding:9px 12px calc(11px + env(safe-area-inset-bottom))}
.cbar .in{flex:1;background:var(--card);border:1px solid var(--line);border-radius:980px;padding:9px 14px;font-size:12.5px;color:var(--text3);cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cbar .mic,.cbar .snd{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none;cursor:pointer}
.cbar .mic{background:var(--card);border:1px solid var(--line)}
.cbar .mic svg{width:17px;height:17px;fill:none;stroke:var(--text2);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.cbar .snd{background:var(--blue)}
.cbar .snd svg{width:17px;height:17px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
/* ===== toast ===== */
.toast{position:absolute;left:50%;bottom:104px;transform:translateX(-50%) translateY(8px);background:rgba(29,29,31,.9);color:#fff;font-size:12px;font-weight:500;padding:10px 18px;border-radius:980px;opacity:0;pointer-events:none;transition:all .25s;z-index:99;max-width:82%;text-align:center}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
/* ===== 动作面板 ===== */
.sheet{position:absolute;inset:0;background:rgba(0,0,0,.4);z-index:50;display:none;align-items:flex-end;padding:0 8px calc(10px + env(safe-area-inset-bottom))}
.sheet.on{display:flex}
.sheet .card{width:100%;background:rgba(249,249,251,.94);backdrop-filter:saturate(180%) blur(24px);-webkit-backdrop-filter:saturate(180%) blur(24px);border-radius:14px;overflow:hidden;animation:up .22s ease}
@keyframes up{from{transform:translateY(24px);opacity:.4}to{transform:translateY(0);opacity:1}}
.sheet .tip{text-align:center;font-size:11.5px;color:var(--text3);padding:11px 14px;border-bottom:.5px solid var(--line)}
.sheet .opt{display:flex;align-items:center;gap:11px;padding:13px 16px;border-bottom:.5px solid var(--line);cursor:pointer}
.sheet .opt:active{background:rgba(0,0,0,.05)}
.sheet .opt .ic{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex:none}
.sheet .opt .ic svg{width:18px;height:18px;fill:none;stroke:#fff;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.sheet .opt b{font-size:14.5px;font-weight:600;display:block}
.sheet .opt p{font-size:11px;color:var(--text3);margin-top:2px}
.sheet .cancel{text-align:center;font-size:15px;font-weight:600;color:var(--blue);padding:14px 0;cursor:pointer;background:var(--card);border-radius:14px;margin-top:8px}
/* ===== 移动端自适应 ===== */
@media(max-width:560px){
  body{padding:0;background:var(--bg);display:block}
  .stage{display:block}
  .note{display:none}
  .device{width:100%!important;border-radius:0;padding:0;box-shadow:none;background:transparent}
  .disp{width:100%!important;height:100dvh;border-radius:0;transition:none}
  .island{display:none}
  .status{padding-top:calc(10px + env(safe-area-inset-top))}
}
</style>
</head>
<body>
<div class="stage">

  <div class="note">
    <span class="eyebrow"><svg viewBox="0 0 24 24"><path d="M12 3l7 3v5c0 4.4-2.9 8.3-7 9.5C7.9 19.3 5 15.4 5 11V6z"/><path d="M9 11.5l2 2 4-4.5"/></svg>企业微信移动端自适应展示</span>
    <h1>憬悟智能 · 工作台应用<small>憬悟大模型平台 · 移动端核心能力</small></h1>
    <p>平台核心能力以 H5 应用接入学校企业微信工作台，师生免登录即开即用；界面按机型屏宽自适应，与网页端同一版本发布、同步更新。</p>
    <div class="kvs">
      <div class="kv"><span>接入方式</span><b>工作台应用 · 企微免登</b></div>
      <div class="kv"><span>自适应范围</span><b>320–414px 主流机型及折叠屏</b></div>
      <div class="kv"><span>覆盖能力</span><b>智能问答 · 应用集市 · 消息提醒 · 个人中心</b></div>
      <div class="kv"><span>发布方式</span><b>与网页端同版本 · v5.2.0</b></div>
    </div>
    <div class="wswitch">
      <span class="lbl">切换屏宽</span>
      <div class="wchips">
        <button class="wchip" data-w="320">320</button>
        <button class="wchip on" data-w="375">375</button>
        <button class="wchip" data-w="414">414</button>
      </div>
    </div>

  let out="",list=null;
  const close=()=>{if(list){out+="</"+list+">";list=null}};
  t.split("\n").forEach(ln=>{
    if(/^\d+\.\s/.test(ln)){if(list!=="ol"){close();out+="<ol>";list="ol"}out+="<li>"+ln.replace(/^\d+\.\s/,"")+"</li>"}
    else if(/^-\s/.test(ln)){if(list!=="ul"){close();out+="<ul>";list="ul"}out+="<li>"+ln.replace(/^-\s/,"")+"</li>"}
    else if(ln.trim()===""){close()}
    else{close();out+="<p>"+ln+"</p>"}
  });
  close();return out;
}
function bubble(a,me,html){
  const d=document.createElement("div");
  d.className="msg"+(me?" me":"");
  d.innerHTML='<span class="av" style="'+grad(a.hue)+'">'+svg(a.icon)+'</span><div class="bd">'+html+"</div>";
  $("#msgs").appendChild(d);$("#msgs").scrollTop=$("#msgs").scrollHeight;
  return d;
}
function openChat(id){
  cur=agentOf(id);buf="";window.__done=[];
  $("#chat-name").textContent=cur.name;
  $("#chat-status").textContent=cur.status;
  $("#msgs").innerHTML="";
  bubble(cur,false,"<p>"+cur.hello+"</p>");
  renderQuick();
  $("#chatpage").classList.add("on");
}
function closeChat(){
  $("#chatpage").classList.remove("on");
  if(tick){clearTimeout(tick);tick=null}
}
function renderQuick(){
  const done=window.__done||[];
  $("#quick").innerHTML=cur.qa.map((q,i)=>done.includes(i)?"":'<span class="qk" data-q="'+i+'">'+q.q+"</span>").join("");
  $$("#quick .qk").forEach(el=>el.onclick=()=>ask(+el.dataset.q));
}
function ask(i){
  const q=cur.qa[i];
  bubble(cur,true,"<p>"+q.q+"</p>");
  window.__done=(window.__done||[]).concat(i);
  renderQuick();
  const th=bubble(cur,false,'<p><span class="typing"><i></i><i></i><i></i></span></p>');
  setTimeout(()=>{
    th.remove();
    const b=bubble(cur,false,'<p><span class="caret"></span></p>');
    const p=b.querySelector("p");buf="";
    let k=0;
    const step=()=>{
      if(k<q.a.length){
        buf+=(k?"\n":"")+q.a[k];k++;
        p.innerHTML=md(buf)+'<span class="caret"></span>';
        $("#msgs").scrollTop=$("#msgs").scrollHeight;
        tick=setTimeout(step,270+Math.random()*330);
      }else{
        p.innerHTML=md(buf);
        if(q.src&&q.src.length){
          const s=document.createElement("div");
          s.className="srcs";
          s.innerHTML=q.src.map(x=>'<span class="src">'+svg("file")+x+"</span>").join("");
          b.querySelector(".bd").appendChild(s);
          $$("#msgs .src").forEach(el=>el.onclick=()=>toast("知识来源："+el.textContent.trim()));
        }
        $("#msgs").scrollTop=$("#msgs").scrollHeight;
      }
    };
    step();
  },600);
}
$("#chat-back").onclick=closeChat;
$("#cbar-in").onclick=()=>{if(!$("#quick").innerHTML)toast("当前应用的推荐问题已全部解答")};
$("#cbar-send").onclick=()=>{
  const left=cur.qa.map((q,i)=>i).filter(i=>!(window.__done||[]).includes(i));
  if(left.length){ask(left[0])}
  else toast("本应用的推荐问题已全部解答，可返回尝试其他应用");
};

/* ---------- 动作面板（问一问） ---------- */
$("#sheet").innerHTML=`
<div class="card">
  <div class="tip">选择一个应用开始提问</div>
  ${AGENTS.map(a=>'<div class="opt" data-ai="'+a.id+'"><span class="ic" style="'+grad(a.hue)+'">'+svg(a.icon)+'</span><div><b>'+a.name+'</b><p>'+a.status.replace("在线 · ","")+'</p></div></div>').join("")}
  <div class="cancel" id="sheet-cancel">取消</div>
</div>`;
function sheet(on){$("#sheet").classList.toggle("on",on)}
$("#sheet").onclick=e=>{if(e.target.id==="sheet"||e.target.id==="sheet-cancel")sheet(false)};
$$("#sheet .opt").forEach(el=>el.onclick=()=>{sheet(false);openChat(el.dataset.ai)});

/* ---------- 全局入口 ---------- */
document.addEventListener("click",e=>{
  const t=e.target.closest("[data-t]");
  if(t&&t.dataset.t)toast(t.dataset.t);
  const el=e.target.closest("[data-ai]");
  if(el&&el.dataset.ai){
    e.stopPropagation();
    if(!agentOf(el.dataset.ai)){toast("该应用为工具类应用，详情请在网页端查看");return}
    openChat(el.dataset.ai)
  }
  const aa=e.target.closest("[data-act]");
  if(aa){
    if(aa.dataset.act==="goto-apps")tab("apps");
    if(aa.dataset.act==="goto-msg")tab("msg");
    if(aa.dataset.act==="ask")sheet(true);
    if(aa.dataset.act==="wx-back")toast("已返回企业微信工作台");
  }
});

/* ---------- 宽度切换 ---------- */
$$(".wchip").forEach(c=>c.onclick=()=>{
  $$(".wchip").forEach(x=>x.classList.toggle("on",x===c));
  const w=+c.dataset.w;
  $("#disp").style.width=w+"px";
  document.querySelector(".device").style.width=(w+22)+"px";
});
</script>

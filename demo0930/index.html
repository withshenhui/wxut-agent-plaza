<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>憬悟 · 大模型平台</title>
<style>
:root{
  --bg:#f5f5f7;--card:#ffffff;--ink:#1d1d1f;--ink2:#6e6e73;--ink3:#a1a1a6;
  --blue:#0071e3;--blue-deep:#0058b8;--blue-wash:rgba(0,113,227,.08);
  --green:#34a853;--red:#e8443a;--orange:#f0a028;--purple:#7d5be9;
  --line:rgba(0,0,0,.09);--line2:rgba(0,0,0,.05);
  --r-lg:18px;--r-md:12px;--r-sm:8px;
  --sh-card:0 1px 3px rgba(0,0,0,.04),0 6px 18px rgba(0,0,0,.05);
  --sh-pop:0 4px 14px rgba(0,0,0,.12),0 20px 50px rgba(0,0,0,.14);
}
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Helvetica Neue",sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.55;min-height:100vh}
a{text-decoration:none;color:inherit}
button{font-family:inherit;border:none;background:none;cursor:pointer;color:inherit;font-size:inherit}
input,select{font-family:inherit;font-size:inherit;color:inherit}
::selection{background:rgba(0,113,227,.18)}
h1,h2,h3{font-weight:700;letter-spacing:-.01em}
.mono{font-family:"SF Mono",ui-monospace,Menlo,Consolas,monospace;font-variant-numeric:tabular-nums}

/* ===== 毛玻璃吸顶导航 ===== */
.topnav{position:sticky;top:0;z-index:100;background:rgba(255,255,255,.72);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-bottom:.5px solid rgba(0,0,0,.1)}
.topnav-in{max-width:1240px;margin:0 auto;padding:0 24px;height:56px;display:flex;align-items:center;gap:6px}
.logo{display:flex;align-items:center;gap:9px;margin-right:20px;flex:none}
.logo .mark{width:26px;height:26px;border-radius:7px;background:linear-gradient(145deg,#3d9bff,var(--blue));display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(0,113,227,.35)}
.logo .mark svg{width:15px;height:15px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.logo .t{font-size:16.5px;font-weight:650;letter-spacing:-.02em;white-space:nowrap}
.mainnav{display:flex;align-items:center;gap:2px;flex:1;min-width:0;overflow-x:auto;scrollbar-width:none}
.mainnav::-webkit-scrollbar{display:none}
.mn{position:relative;padding:7px 13px;font-size:13.5px;font-weight:500;color:var(--ink2);border-radius:9px;white-space:nowrap;transition:color .15s}
.mn:hover{color:var(--ink)}
.mn.on{color:var(--ink);font-weight:600}
.mn.on::after{content:"";position:absolute;left:13px;right:13px;bottom:-11px;height:2.5px;border-radius:2px;background:var(--blue)}
.navr{display:flex;align-items:center;gap:12px;flex:none;margin-left:6px}
.nsearch{display:flex;align-items:center;gap:7px;background:rgba(0,0,0,.05);border-radius:9px;padding:6px 11px;width:180px;transition:width .2s,background .2s}
.nsearch:focus-within{width:230px;background:rgba(0,0,0,.08)}
.nsearch svg{width:13px;height:13px;stroke:var(--ink3);fill:none;stroke-width:2;stroke-linecap:round;flex:none}
.nsearch input{border:none;background:none;outline:none;width:100%;font-size:13px}
.nsearch input::placeholder{color:var(--ink3)}
.nico{position:relative;width:32px;height:32px;display:flex;align-items:center;justify-content:center;border-radius:50%;transition:background .15s}
.nico:hover{background:rgba(0,0,0,.06)}
.nico svg{width:17px;height:17px;stroke:var(--ink2);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nico .dot{position:absolute;top:5px;right:5px;width:8px;height:8px;border-radius:50%;background:var(--red);border:1.5px solid #fff}
.avatar{width:30px;height:30px;border-radius:50%;background:linear-gradient(145deg,#c56cf0,#5f6bff);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:600;flex:none}

/* ===== 主区 ===== */
.shell{max-width:1240px;margin:0 auto;padding:30px 24px 60px}
.vhead{margin:6px 0 24px}
.vhead h1{font-size:29px;letter-spacing:-.025em}
.vhead p{color:var(--ink2);font-size:14px;margin-top:6px}
.vhead .row{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}

/* 按钮 */
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:980px;font-size:13.5px;font-weight:500;transition:all .18s;white-space:nowrap}
.btn svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.btn-p{background:var(--blue);color:#fff}
.btn-p:hover{background:var(--blue-deep)}
.btn-o{background:#fff;color:var(--ink);box-shadow:var(--sh-card)}
.btn-o:hover{background:rgba(0,0,0,.03)}
.btn-s{padding:5px 12px;font-size:12.5px;border-radius:980px;background:rgba(0,113,227,.09);color:var(--blue);font-weight:550}
.btn-s:hover{background:rgba(0,113,227,.16)}

/* 卡片 */
.card{background:var(--card);border-radius:var(--r-lg);box-shadow:var(--sh-card);padding:22px}
.card .chead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
.card .chead h3{font-size:16px;letter-spacing:-.015em}
.card .chead .more{font-size:12.5px;color:var(--blue);font-weight:500}
.card .chead .more:hover{text-decoration:underline}

/* KPI */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
.kpi{background:var(--card);border-radius:var(--r-lg);box-shadow:var(--sh-card);padding:19px 20px;position:relative;overflow:hidden}
.kpi .lb{font-size:12.5px;color:var(--ink2);font-weight:500}
.kpi .v{font-size:27px;font-weight:700;letter-spacing:-.03em;margin-top:5px;font-variant-numeric:tabular-nums}
.kpi .sub{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--ink3);margin-top:6px}
.kpi .sub .up{color:var(--green);font-weight:600}
.kpi .sub .dn{color:var(--red);font-weight:600}
.kpi .ico{position:absolute;top:18px;right:18px;width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--blue-wash)}
.kpi .ico svg{width:17px;height:17px;stroke:var(--blue);fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.kpi .bar{position:absolute;left:0;top:0;bottom:0;width:3.5px}

/* 布局格 */
.g2{display:grid;grid-template-columns:1.6fr 1fr;gap:16px;margin-bottom:18px}
.g2e{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:18px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:18px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:18px}

/* 表格（苹果风：无竖线、轻斑马纹、粗表头字） */
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;font-weight:600;color:var(--ink2);font-size:12px;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:11px 12px;border-bottom:.5px solid var(--line2);vertical-align:middle}
.tbl tr:last-child td{border-bottom:none}
.tbl tbody tr{transition:background .12s}
.tbl tbody tr:hover{background:rgba(0,0,0,.022)}
.tbl .num{text-align:right;font-variant-numeric:tabular-nums}

/* iOS 分段控件 */
.seg{display:inline-flex;background:rgba(0,0,0,.06);border-radius:9px;padding:2px;gap:1px}
.seg button{padding:5px 13px;font-size:12.5px;font-weight:500;color:var(--ink2);border-radius:7px;transition:all .15s;white-space:nowrap}
.seg button.on{background:#fff;color:var(--ink);font-weight:600;box-shadow:0 1px 4px rgba(0,0,0,.14)}

/* iOS 开关 */
.sw{position:relative;width:40px;height:24px;border-radius:980px;background:rgba(0,0,0,.16);transition:background .2s;flex:none;cursor:pointer}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
.sw.on{background:var(--green)}
.sw.on::after{transform:translateX(16px)}

/* 药丸标签 */
.pill{display:inline-flex;align-items:center;gap:4px;padding:2.5px 10px;border-radius:980px;font-size:11.5px;font-weight:550;white-space:nowrap}
.pill.b{background:var(--blue-wash);color:var(--blue)}
.pill.g{background:rgba(52,168,83,.1);color:#247a3d}
.pill.r{background:rgba(232,68,58,.09);color:#c13028}
.pill.o{background:rgba(240,160,40,.12);color:#b06e0a}
.pill.n{background:rgba(0,0,0,.055);color:var(--ink2)}
.pill.v{background:rgba(125,91,233,.1);color:#5f3fd4}
.pill .idot{width:6px;height:6px;border-radius:50%;background:currentColor}

/* 进度条 */
.prog{height:6px;border-radius:980px;background:rgba(0,0,0,.07);overflow:hidden}
.prog i{display:block;height:100%;border-radius:980px;background:var(--blue);transition:width .3s}

/* 页签（下划线式，非胶囊） */
.tabs{display:flex;gap:26px;border-bottom:1px solid var(--line);margin-bottom:18px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:10px 2px;font-size:13.5px;font-weight:500;color:var(--ink2);position:relative;white-space:nowrap;transition:color .15s}
.tab:hover{color:var(--ink)}
.tab.on{color:var(--ink);font-weight:600}
.tab.on::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2.5px;border-radius:2px;background:var(--ink)}

/* 视图切换 */
.view{display:none}
.view.on{display:block;animation:fadein .3s ease}
@keyframes fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* toast（底部居中胶囊，iOS 通知风） */
#toast{position:fixed;left:50%;bottom:34px;transform:translateX(-50%) translateY(20px);background:rgba(29,29,31,.92);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);color:#fff;padding:11px 22px;border-radius:980px;font-size:13.5px;font-weight:500;opacity:0;pointer-events:none;transition:all .28s;z-index:999;box-shadow:0 8px 30px rgba(0,0,0,.3);white-space:nowrap;max-width:90vw;overflow:hidden;text-overflow:ellipsis}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* 通用工具类 */
.rowb{display:flex;align-items:center;justify-content:space-between;gap:12px}
.mut{color:var(--ink2)}
.sm{font-size:12.5px}
.hr{height:1px;background:var(--line2);margin:14px 0}

.appgrid{grid-template-columns:repeat(3,1fr);gap:12px}
.appgrid>div{border:.5px solid var(--line2);border-radius:var(--r-md);padding:16px;display:flex;flex-direction:column;gap:11px;transition:all .2s;cursor:pointer;min-width:0}
.appgrid>div:hover{box-shadow:var(--sh-card);transform:translateY(-2px)}
.appgrid .ttl{display:flex;gap:12px;align-items:center;min-width:0}
.appgrid .ttl>div{min-width:0;flex:1}
.appgrid .ttl .nm{font-weight:650;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.appgrid .ttl .dp{display:flex;justify-content:space-between;gap:8px}
.appgrid .ttl .dp .dnm{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.appgrid .desc{white-space:normal}

/* 响应式 */
@media(max-width:1080px){.kpis{grid-template-columns:repeat(2,1fr)}.g2,.g2e{grid-template-columns:1fr}.g3{grid-template-columns:1fr 1fr}.g4{grid-template-columns:1fr 1fr}.nsearch{display:none}.appgrid{grid-template-columns:1fr 1fr}}
@media(max-width:720px){.kpis,.g3,.g4{grid-template-columns:1fr}.appgrid{grid-template-columns:1fr}.shell{padding:20px 16px 50px}.vhead h1{font-size:24px}.navr .nico:not(.av-wrap){display:none}}
</style>
</head>
<body>

<nav class="topnav">
  <div class="topnav-in">
    <a class="logo" href="javascript:void(0)">
      <span class="mark"><svg viewBox="0 0 24 24"><path d="M12 3v3M12 18v3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M3 12h3M18 12h3M4.9 19.1 7 17M17 7l2.1-2.1"/><circle cx="12" cy="12" r="4"/></svg></span>
      <span class="t">憬悟</span>
    </a>
    <div class="mainnav" id="mainnav">
      <a class="mn on" data-w="home">工作台</a>
      <a class="mn" data-w="models">模型广场</a>
      <a class="mn" data-w="brain">知识中枢</a>
      <a class="mn" data-w="build">场景编排</a>
      <a class="mn" data-w="apps">应用集市</a>
      <a class="mn" data-w="dev">开发者中心</a>
      <a class="mn" data-w="observe">观测告警</a>
      <a class="mn" data-w="guard">安全护栏</a>
      <a class="mn" data-w="admin">组织与配置</a>
    </div>
    <div class="navr">
      <div class="nsearch"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input placeholder="搜索功能、模型、应用"></div>
      <button class="nico" id="bell" title="通知"><svg viewBox="0 0 24 24"><path d="M18 8a6 6 0 1 0-12 0c0 7-3 8-3 8h18s-3-1-3-8"/><path d="M13.7 20a2 2 0 0 1-3.4 0"/></svg><i class="dot"></i></button>
      <span class="nico av-wrap" title="账号"><span class="avatar">沈</span></span>
    </div>
  </div>
</nav>

<div class="shell">
<div class="view on" id="vw-home"></div>
<div class="view" id="vw-models"></div>
<div class="view" id="vw-brain"></div>
<div class="view" id="vw-build"></div>
<div class="view" id="vw-apps"></div>
<div class="view" id="vw-dev"></div>
<div class="view" id="vw-observe"></div>
<div class="view" id="vw-guard"></div>
<div class="view" id="vw-admin"></div>
</div>

<div id="toast"><span id="toastmsg"></span></div>

<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];

/* ===== 导航引擎 ===== */
const VNAMES={home:"工作台",models:"模型广场",brain:"知识中枢",build:"场景编排",apps:"应用集市",dev:"开发者中心",observe:"观测告警",guard:"安全护栏",admin:"组织与配置"};
function goto(w){
  $$(".mn").forEach(x=>x.classList.toggle("on",x.dataset.w===w));
  $$(".view").forEach(x=>x.classList.remove("on"));
  $("#vw-"+w).classList.add("on");
  window.scrollTo({top:0,behavior:"instant"});
}
$$(".mn").forEach(n=>n.onclick=()=>goto(n.dataset.w));
const toast=m=>{const t=$("#toast");$("#toastmsg").textContent=m;t.classList.add("show");clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove("show"),2200)};
document.addEventListener("click",e=>{const t=e.target.closest("[data-t]");if(t)toast(t.dataset.t)});
$$("[data-goto]").forEach(b=>b.addEventListener("click",()=>goto(b.dataset.goto)));
$$(".tabs").forEach(tb=>{
  const panes=tb.parentElement.querySelectorAll(":scope > .tpane");
  tb.querySelectorAll(".tab").forEach(t=>t.onclick=()=>{
    tb.querySelectorAll(".tab").forEach(x=>x.classList.remove("on"));t.classList.add("on");
    panes.forEach((p,i)=>p.classList.toggle("on",i===[...tb.children].indexOf(t)));
  });
});
$$(".sw").forEach(s=>s.onclick=()=>{s.classList.toggle("on");if(s.dataset.t)toast(s.dataset.t)});
$$(".seg").forEach(sg=>sg.querySelectorAll("button").forEach(b=>b.onclick=()=>{
  sg.querySelectorAll("button").forEach(x=>x.classList.remove("on"));b.classList.add("on");
  if(b.dataset.t)toast(b.dataset.t);
}));

/* ===== SVG 图标库 ===== */
const ICONS={
  bolt:'<path d="M13 2 4.5 13.5H11L9.5 22 19 10h-6.5z"/>',
  brain:'<path d="M9.5 3A2.5 2.5 0 0 0 7 5.5c-1.8.3-3 1.7-3 3.5 0 .9.3 1.7.9 2.3-.6.6-.9 1.4-.9 2.2 0 1.9 1.6 3.5 3.5 3.5h.1A2.5 2.5 0 0 0 12 19V5.5A2.5 2.5 0 0 0 9.5 3z"/><path d="M14.5 3A2.5 2.5 0 0 1 17 5.5c1.8.3 3 1.7 3 3.5 0 .9-.3 1.7-.9 2.3.6.6.9 1.4.9 2.2 0 1.9-1.6 3.5-3.5 3.5h-.1A2.5 2.5 0 0 1 12 19"/>',
  cube:'<path d="M12 2 3 7v10l9 5 9-5V7z"/><path d="m3 7 9 5 9-5M12 12v10"/>',
  chart:'<path d="M3 3v18h18"/><path d="M7 15v3M12 10v8M17 6v12"/>',
  shield:'<path d="M12 2 4 5.5V11c0 5 3.4 8.6 8 11 4.6-2.4 8-6 8-11V5.5z"/>',
  users:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.2 3.4-5 6.5-5s5.7 1.8 6.5 5"/><circle cx="17.5" cy="9" r="2.5"/><path d="M17 15.2c2.3.2 4 1.6 4.5 4"/>',
  doc:'<path d="M6 2h8l4 4v16H6z"/><path d="M14 2v4h4M9 12h6M9 16h6"/>',
  key:'<circle cx="8" cy="15" r="4.5"/><path d="m11.5 11.5 8-8M17 4l3 3M14.5 6.5l3 3"/>',
  gear:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3h.1a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5h.1a1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9v.1a1.7 1.7 0 0 0 1.5 1h.2a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>',
  spark:'<path d="M12 2l1.8 6.2L20 10l-6.2 1.8L12 18l-1.8-6.2L4 10l6.2-1.8z"/><path d="M19 15l.9 3.1L23 19l-3.1.9L19 23l-.9-3.1L15 19l3.1-.9z"/>',
  clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/>',
  alert:'<path d="M12 3 2 20h20z"/><path d="M12 9.5v4.5M12 17.2v.1"/>',
  flow:'<rect x="3" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="16" width="7" height="5" rx="1.5"/><path d="M6.5 8v5a3 3 0 0 0 3 3H14"/>',
  db:'<ellipse cx="12" cy="5.5" rx="8" ry="3"/><path d="M4 5.5v13c0 1.7 3.6 3 8 3s8-1.3 8-3v-13"/><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/>',
  api:'<path d="M4 7h16M4 12h16M4 17h10"/><circle cx="19" cy="17" r="2.5"/>',
  book:'<path d="M4 4a2 2 0 0 1 2-2h14v18H6a2 2 0 0 0-2 2z"/><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>',
  send:'<path d="m3 11 18-8-8 18-2.5-7.5z"/><path d="M10.5 13.5 21 3"/>',
  pulse:'<path d="M3 12h4l2.5-7 4 14 2.5-7h5"/>',
  lock:'<rect x="5" y="10" width="14" height="11" rx="2.5"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/>',
  eye:'<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/>'
};
const icon=(k,cls="")=>`<svg viewBox="0 0 24 24" class="${cls}">${ICONS[k]||ICONS.doc}</svg>`;

/* ===== 工作台 ===== */
$("#vw-home").innerHTML=`
<div class="vhead"><div class="row"><div>
  <h1>下午好，沈知行</h1>
  <p>平台今日已服务全校 <b class="mono" style="color:var(--ink)">18,642</b> 次智能请求 · 一切运行正常</p>

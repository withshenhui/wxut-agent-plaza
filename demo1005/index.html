<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>喔PLUS AI中台 · XX大学</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --blue:#1668ff;--blue-d:#0d4fd6;--sky:#41b1ff;--sky-weak:#e3f1ff;
  --bg:#eef5fe;--card:#fff;--line:#e2ecf9;--line2:#ecf3fc;
  --ink:#0a2540;--ink2:#4a6076;--ink3:#8ba0b6;
  --ok:#12b76a;--warn:#f59e0b;--bad:#ef4444;
  --grad:linear-gradient(135deg,#1668ff 0%,#2f9bff 55%,#41b1ff 100%);
  --grad-soft:linear-gradient(135deg,#eaf3ff,#f5faff);
}
html{scroll-behavior:smooth}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;background:
  radial-gradient(900px 420px at 12% -6%,rgba(65,177,255,.16),transparent 60%),
  radial-gradient(800px 400px at 96% 0%,rgba(22,104,255,.12),transparent 55%),
  var(--bg);
  color:var(--ink);min-height:100vh}
::selection{background:#cfe5ff}
.mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
button{font-family:inherit}
/* ============ 左侧导航（悬浮圆角栏） ============ */
.frame{display:flex;gap:16px;max-width:1440px;margin:0 auto;padding:14px 18px 14px 14px;align-items:flex-start}
.side{width:230px;flex:none;position:sticky;top:14px;height:calc(100vh - 28px);min-height:560px;display:flex;flex-direction:column;gap:4px;background:linear-gradient(180deg,#ffffff 0%,#f3f9ff 100%);border:1px solid rgba(255,255,255,.95);border-radius:26px;box-shadow:0 18px 44px rgba(22,104,255,.10),0 2px 8px rgba(10,37,64,.04);padding:18px 13px 14px;overflow:hidden}
.side::before{content:"";position:absolute;left:-46px;top:-46px;width:150px;height:150px;border-radius:50%;background:radial-gradient(circle,rgba(65,177,255,.18),transparent 70%);pointer-events:none}
.brand{display:flex;align-items:center;gap:10px;padding:2px 6px 14px;border-bottom:1px solid var(--line);margin-bottom:10px;cursor:pointer}
.brand .mark{width:40px;height:40px;border-radius:13px;background:var(--grad);color:#fff;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:800;box-shadow:0 7px 16px rgba(22,104,255,.35);flex:none}
.brand .btx{min-width:0}
.brand .bt{font-size:15.5px;font-weight:800;letter-spacing:.2px;white-space:nowrap}
.brand .bt em{font-style:normal;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.brand .be{font-size:8.5px;color:var(--ink3);letter-spacing:1.5px;font-weight:600;margin-top:2px;white-space:nowrap}
.nav{display:flex;flex-direction:column;gap:3px;flex:1;overflow-y:auto;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.dk{position:relative;display:flex;align-items:center;gap:11px;border:0;background:transparent;color:var(--ink2);font-size:13px;font-weight:600;padding:11px 13px;border-radius:14px;cursor:pointer;transition:all .18s;white-space:nowrap;text-align:left}
.dk svg{width:17px;height:17px;fill:currentColor;flex:none}
.dk:hover{color:var(--blue);background:var(--sky-weak)}
.dk.on{color:#fff;background:var(--grad);box-shadow:0 7px 16px rgba(22,104,255,.35)}
.sidecard{margin:10px 4px 8px;background:var(--grad-soft);border:1px solid #d5e8ff;border-radius:18px;padding:13px 14px;cursor:pointer}
.sidecard .sch{display:flex;align-items:center;gap:7px;font-size:11px;font-weight:700;color:var(--ink2)}
.sidecard .sch svg{width:14px;height:14px;fill:var(--blue)}
.sidecard b{display:block;font-size:20px;font-weight:800;letter-spacing:-.4px;margin-top:7px;font-variant-numeric:tabular-nums}
.sidecard b small{font-size:10.5px;color:var(--ink3);font-weight:600;margin-left:3px}
.sidecard .track{margin-top:8px;height:6px}
.sidecard em{display:block;font-style:normal;font-size:10px;color:var(--ink3);margin-top:6px}
.sidefoot{padding:6px 6px 0;font-size:9.5px;color:var(--ink3);letter-spacing:.4px}
.main{flex:1;min-width:0;padding-top:2px}
.mtop{display:flex;align-items:center;gap:10px;padding:4px 2px 12px}
.mcrumb{font-size:12px;color:var(--ink3);font-weight:600}
.mcrumb b{color:var(--ink);font-weight:800}
.mtop .sp{flex:1}
.tbtn{position:relative;width:36px;height:36px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.8);color:var(--ink2);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .15s;flex:none}
.tbtn:hover{color:var(--blue);border-color:#bcd8ff;box-shadow:0 4px 12px rgba(22,104,255,.12)}
.tbtn svg{width:17px;height:17px;fill:currentColor}
.tbtn .rdot{position:absolute;top:7px;right:8px;width:7px;height:7px;border-radius:50%;background:var(--bad);border:1.5px solid #fff}
.who{display:flex;align-items:center;gap:9px;padding:4px 12px 4px 4px;border-radius:13px;border:1px solid var(--line);background:rgba(255,255,255,.8);cursor:pointer}
.who .av{width:29px;height:29px;border-radius:10px;background:var(--grad);color:#fff;font-size:12.5px;font-weight:700;display:flex;align-items:center;justify-content:center}
.who .un{font-size:12.5px;font-weight:700;line-height:1.2}
.who .ur{font-size:10px;color:var(--ink3)}
/* ============ 骨架 ============ */
.shell{padding:0 0 56px}
.view{display:none;animation:vin .3s ease}
.view.on{display:block}
@keyframes vin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
/* 面包屑 */
.crumb{display:flex;align-items:center;gap:8px;padding:2px 2px 14px;font-size:12px;color:var(--ink3)}
.crumb b{color:var(--ink);font-size:13px;font-weight:700}
.crumb svg{width:12px;height:12px;fill:#c2d4ea}
/* ============ 通用组件 ============ */
.card{background:var(--card);border:1px solid rgba(255,255,255,.9);border-radius:22px;box-shadow:0 14px 34px rgba(22,104,255,.08),0 2px 6px rgba(10,37,64,.04)}
.cpad{padding:20px 22px}
.ch{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.ch .t{font-size:15.5px;font-weight:800;letter-spacing:-.2px}
.ch .sub{font-size:11.5px;color:var(--ink3);margin-left:2px}
.ch .more{margin-left:auto;font-size:12px;color:var(--blue);font-weight:600;cursor:pointer}
.chip-ic{width:34px;height:34px;border-radius:11px;background:var(--sky-weak);color:var(--blue);display:flex;align-items:center;justify-content:center;flex:none}
.chip-ic svg{width:18px;height:18px;fill:currentColor}
.chip-ic.deep{background:var(--grad);color:#fff;box-shadow:0 5px 12px rgba(22,104,255,.3)}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:700;padding:3px 10px;border-radius:999px}
.pill.g{color:#067647;background:#e7f8f0}
.pill.b{color:var(--blue);background:var(--sky-weak)}
.pill.o{color:#b45309;background:#fdf3e2}
.pill.r{color:#b42318;background:#fee9e7}
.pill.n{color:var(--ink2);background:var(--line2)}
.btn{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:700;border-radius:13px;padding:9px 16px;cursor:pointer;border:1px solid var(--line);background:#fff;color:var(--ink);transition:all .15s}
.btn svg{width:15px;height:15px;fill:currentColor}
.btn:hover{border-color:#bcd8ff;color:var(--blue)}
.btn.pri{background:var(--grad);border-color:transparent;color:#fff;box-shadow:0 8px 18px rgba(22,104,255,.32)}
.btn.pri:hover{color:#fff;filter:brightness(1.06)}
.btn.sm{padding:6px 12px;font-size:11.5px;border-radius:11px}
.table{width:100%;border-collapse:collapse;font-size:12.5px}
.table th{text-align:left;font-size:11px;color:var(--ink3);font-weight:700;padding:9px 10px;border-bottom:1.5px solid var(--line);white-space:nowrap}
.table td{padding:11px 10px;border-bottom:1px solid var(--line2);vertical-align:middle}
.table tr:last-child td{border-bottom:0}
.table tr:hover td{background:#f7fbff}
.tmain{font-weight:700;color:var(--ink)}
.tsub{font-size:11px;color:var(--ink3);margin-top:2px}
.num{font-variant-numeric:tabular-nums;font-weight:800}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block;margin-right:6px}
.track{height:8px;border-radius:99px;background:var(--line2);overflow:hidden}
.track i{display:block;height:100%;border-radius:99px;background:var(--grad)}
.toast{position:fixed;left:50%;bottom:34px;transform:translateX(-50%) translateY(10px);background:rgba(10,37,64,.92);color:#fff;font-size:12.5px;font-weight:600;padding:11px 20px;border-radius:999px;opacity:0;pointer-events:none;transition:all .25s;z-index:200;box-shadow:0 12px 30px rgba(10,37,64,.35)}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
/* 页签 */
.tabs{display:flex;gap:6px;background:var(--line2);border-radius:13px;padding:4px;width:max-content}
.tabs button{border:0;background:transparent;font-size:12px;font-weight:700;color:var(--ink2);padding:7px 14px;border-radius:10px;cursor:pointer;transition:all .15s}
.tabs button.on{background:#fff;color:var(--blue);box-shadow:0 2px 8px rgba(22,104,255,.14)}
/* ============ 响应式 ============ */
@media(max-width:1200px){
  .frame{padding:10px 12px;gap:12px}
  .side{width:200px;padding:16px 10px 12px}
  .shell{padding:0 0 50px}
  .who .un,.who .ur{display:none}
  .who{padding:4px}
}
@media(max-width:1080px){
  .frame{padding:10px}
  .side{width:66px;padding:14px 9px 12px;border-radius:22px}
  .side .btx,.side .lab,.sidecard,.sidefoot{display:none}
  .brand{justify-content:center;padding:2px 0 12px}
  .dk{justify-content:center;padding:12px 0;gap:0}
  .mcrumb{display:none}
  .grid4{grid-template-columns:1fr 1fr}
  .mgrid{grid-template-columns:1fr 1fr}
  .wiz{grid-template-columns:1fr}
  .grid2{grid-template-columns:1fr}
}
/* ============ 视图组件 ============ */
/* 驾驶舱 hero */
.hero{position:relative;overflow:hidden;border-radius:26px;background:var(--grad);color:#fff;padding:26px 28px;box-shadow:0 18px 44px rgba(22,104,255,.35)}
.hero::before,.hero::after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.14)}
.hero::before{width:300px;height:300px;right:-90px;top:-160px}
.hero::after{width:190px;height:190px;right:110px;bottom:-120px;background:rgba(255,255,255,.09)}
.hero .hg{font-size:23px;font-weight:800;letter-spacing:-.3px}
.hero .hs{font-size:12.5px;opacity:.85;margin-top:5px}
.hero .hbtns{display:flex;gap:10px;margin-top:18px;position:relative;z-index:1}
.hbtn{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:700;border-radius:13px;padding:9px 16px;cursor:pointer;border:1px solid rgba(255,255,255,.4);background:rgba(255,255,255,.14);color:#fff;backdrop-filter:blur(4px)}
.hbtn svg{width:15px;height:15px;fill:currentColor}
.hbtn.solid{background:#fff;color:var(--blue);border-color:#fff}
.hero .hstats{position:absolute;right:26px;top:24px;display:flex;gap:26px;z-index:1;text-align:right}
.hero .hstats b{display:block;font-size:21px;font-weight:800;font-variant-numeric:tabular-nums}
.hero .hstats em{font-style:normal;font-size:10.5px;opacity:.8}
/* Bento */
.grid2{display:grid;grid-template-columns:1.6fr 1fr;gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.kpi{padding:17px 18px;display:flex;flex-direction:column;gap:10px}
.kpi .r{display:flex;align-items:center;gap:10px}
.kpi .v{font-size:26px;font-weight:800;letter-spacing:-.6px;font-variant-numeric:tabular-nums}
.kpi .v small{font-size:12px;color:var(--ink3);font-weight:600;margin-left:3px}
.kpi .d{font-size:11px;color:var(--ink3)}
.kpi .d b.up{color:var(--ok)}.kpi .d b.dn{color:var(--bad)}
/* 卡片网格（模型/员工/知识库） */
.mgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.kgrid{grid-template-columns:repeat(auto-fit,minmax(172px,1fr))}
.mcard{padding:16px;cursor:pointer;transition:all .18s;display:flex;flex-direction:column;gap:11px}
.mcard:hover{transform:translateY(-3px);box-shadow:0 20px 40px rgba(22,104,255,.16)}
.mcard .hd{display:flex;align-items:center;gap:10px}
.mcard .ic{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex:none}
.mcard .ic svg{width:21px;height:21px;fill:currentColor}
.mcard .ic.blue{background:var(--sky-weak);color:var(--blue)}
.mcard .ic.navy{background:#e7edfb;color:#3b5bd6}
.mcard .ic.solidg{background:var(--grad);color:#fff;box-shadow:0 5px 12px rgba(22,104,255,.3)}
.mcard .nm{font-size:14px;font-weight:800;letter-spacing:-.2px}
.mcard .ds{font-size:10.5px;color:var(--ink3);margin-top:2px}
.mcard p{font-size:11.5px;color:var(--ink2);line-height:1.6;flex:1}
.mcard .ft{display:flex;align-items:center;gap:8px;border-top:1px solid var(--line2);padding-top:11px}
.mcard .ft .k{font-size:10.5px;color:var(--ink3)}
.mcard .ft .k b{color:var(--ink);font-size:12px}
.mcard.solo{border:1.5px dashed #b7d4ff;background:var(--grad-soft);align-items:center;justify-content:center;text-align:center;color:var(--blue);min-height:150px;gap:8px}
.mcard.solo svg{width:26px;height:26px;fill:currentColor}
.mcard.solo b{font-size:13px}
/* 流水线 */
.pipe{display:flex;align-items:stretch;gap:0;margin-bottom:16px;overflow-x:auto;padding-bottom:4px}
.pnode{flex:1;min-width:150px;position:relative;padding:14px 16px 14px 22px;background:var(--card);border-radius:16px;box-shadow:0 8px 22px rgba(22,104,255,.08)}
.pnode:not(:last-child){margin-right:26px}
.pnode:not(:last-child)::after{content:"";position:absolute;right:-24px;top:50%;transform:translateY(-50%);border:7px solid transparent;border-left-color:#9cc7ff}
.pnode .pn{display:flex;align-items:center;gap:8px;font-weight:800;font-size:13px}
.pnode .pn i{font-style:normal;width:22px;height:22px;border-radius:8px;background:var(--grad);color:#fff;font-size:11px;display:flex;align-items:center;justify-content:center}
.pnode p{font-size:10.5px;color:var(--ink3);margin-top:6px;line-height:1.55}
/* 向导 */
.wiz{display:grid;grid-template-columns:1.25fr .9fr;gap:16px}
.wsteps{display:flex;gap:6px;margin-bottom:16px}
.wstep{flex:1;display:flex;align-items:center;gap:8px;padding:9px 12px;border-radius:12px;background:var(--line2);color:var(--ink3);font-size:12px;font-weight:700}
.wstep i{font-style:normal;width:21px;height:21px;border-radius:50%;background:#fff;color:var(--ink3);display:flex;align-items:center;justify-content:center;font-size:11px;flex:none}
.wstep.on{background:var(--grad);color:#fff;box-shadow:0 6px 14px rgba(22,104,255,.3)}
.wstep.on i{background:rgba(255,255,255,.25);color:#fff}
.wstep.done{background:var(--sky-weak);color:var(--blue)}
.wstep.done i{background:var(--blue);color:#fff}
.selgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.selopt{border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;cursor:pointer;transition:all .15s;display:flex;gap:10px;align-items:center}
.selopt:hover{border-color:#9cc7ff}
.selopt.on{border-color:var(--blue);background:var(--sky-weak);box-shadow:0 0 0 3px rgba(22,104,255,.12)}
.selopt .ic{width:34px;height:34px;border-radius:10px;background:var(--sky-weak);color:var(--blue);display:flex;align-items:center;justify-content:center;flex:none}
.selopt .ic svg{width:18px;height:18px;fill:currentColor}
.selopt b{font-size:12.5px;display:block}
.selopt em{font-style:normal;font-size:10.5px;color:var(--ink3)}
.wfoot{display:flex;gap:10px;margin-top:16px;align-items:center}
.preview{background:var(--grad-soft);border:1.5px solid #cfe4ff;border-radius:20px;padding:18px;text-align:center}
.preview .pav{width:64px;height:64px;border-radius:20px;background:var(--grad);color:#fff;display:flex;align-items:center;justify-content:center;margin:6px auto 12px;box-shadow:0 12px 26px rgba(22,104,255,.35)}
.preview .pav svg{width:32px;height:32px;fill:#fff}
.preview b{font-size:16px;font-weight:800;display:block}
.preview .pv{font-size:11px;color:var(--ink2);margin-top:4px}
.preview .tags{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:12px}
.preview .tags span{font-size:10px;font-weight:700;color:var(--blue);background:#fff;border:1px solid #cfe4ff;border-radius:999px;padding:3px 10px}
/* 代码块 */
.code{background:#0b1e3d;color:#c9e2ff;border-radius:18px;padding:18px 20px;font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:12px;line-height:1.85;overflow-x:auto;position:relative}
.code .chd{display:flex;align-items:center;gap:8px;margin-bottom:10px;color:#7fa3d4;font-size:11px}
.code .chd .dots{display:flex;gap:5px}
.code .chd .dots i{width:9px;height:9px;border-radius:50%;background:#274a7d}
.code .copy{margin-left:auto;font-size:11px;color:#9cc7ff;border:1px solid #274a7d;border-radius:8px;padding:3px 10px;cursor:pointer}
.code .copy:hover{color:#fff}
.code .c1{color:#6ec7ff}.code .c2{color:#8ef0c5}.code .c3{color:#ffd479}.code .c4{color:#93a8c7}
/* 图表 */
.chart-wrap{width:100%}
.legend{display:flex;gap:14px;font-size:11px;color:var(--ink3)}
.legend i{width:9px;height:9px;border-radius:3px;display:inline-block;margin-right:5px;vertical-align:-1px}
.hbar{display:flex;flex-direction:column;gap:11px}
.hb .r{display:flex;align-items:center;gap:10px;font-size:12px}
.hb .r .lb{width:64px;flex:none;color:var(--ink2);font-weight:600}
.hb .r .tk{flex:1;height:9px;border-radius:99px;background:var(--line2);overflow:hidden}
.hb .r .tk i{display:block;height:100%;border-radius:99px;background:var(--grad)}
.hb .r .vv{width:44px;text-align:right;font-weight:800;font-size:11.5px;font-variant-numeric:tabular-nums}
/* 时间线 */
.tl{display:flex;flex-direction:column}
.tli{display:flex;gap:12px;position:relative;padding-bottom:16px}
.tli:last-child{padding-bottom:0}
.tli::before{content:"";position:absolute;left:13px;top:30px;bottom:2px;width:2px;background:var(--line2)}
.tli:last-child::before{display:none}
.tli .tic{width:27px;height:27px;border-radius:9px;flex:none;display:flex;align-items:center;justify-content:center;z-index:1}
.tli .tic svg{width:14px;height:14px;fill:currentColor}
.tli .tt{font-size:12.5px;font-weight:600}
.tli .tt b{color:var(--blue)}
.tli .tm{font-size:10.5px;color:var(--ink3);margin-top:2px}
@media(max-width:640px){.grid3{grid-template-columns:1fr!important}.grid4{grid-template-columns:1fr}.mgrid{grid-template-columns:1fr}.hero .hstats{display:none}.mcrumb{display:none}}
/* 开关 */
.swrow{display:flex;align-items:center;gap:10px;padding:12px 2px;border-bottom:1px solid var(--line2)}
.swrow:last-child{border-bottom:0}
.swrow .lb{flex:1}
.swrow b{font-size:13px;display:block}
.swrow p{font-size:11px;color:var(--ink3);margin-top:2px}
.sw{width:42px;height:24px;border-radius:99px;background:#c8d8ee;position:relative;cursor:pointer;transition:.2s;flex:none;border:0;padding:0}
.sw::after{content:"";position:absolute;top:2.5px;left:2.5px;width:19px;height:19px;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(10,37,64,.25);transition:.2s}
.sw.on{background:var(--blue)}
.sw.on::after{left:20.5px}
</style>
</head>
<body>
<div class="frame">
  <aside class="side">
    <div class="brand" data-act="go-home">
      <span class="mark">喔</span>
      <div class="btx">
        <div class="bt">喔<em>PLUS</em> AI中台</div>
        <div class="be">WOPLUS AI PLATFORM</div>
      </div>
    </div>

/* ---------- 图表 ---------- */
function areaChart(data,labels,w,h,color){
  const max=Math.max.apply(null,data)*1.18,step=(w-30)/(data.length-1);
  const pts=data.map((v,i)=>[26+i*step,(h-24-(v/max)*(h-40)).toFixed(1)]);
  const line=pts.map(p=>p.join(",")).join(" ");
  const dots=pts.map((p,i)=>'<circle cx="'+p[0]+'" cy="'+p[1]+'" r="3.4" fill="#fff" stroke="'+color+'" stroke-width="2.4"/>').join("");
  const labs=labels.map((l,i)=>'<text x="'+(26+i*step)+'" y="'+(h-6)+'" font-size="9.5" fill="#8ba0b6" text-anchor="middle">'+l+'</text>').join("");
  const grid=[0.25,0.5,0.75,1].map(g=>'<line x1="26" x2="'+(w-4)+'" y1="'+((h-24)-(h-40)*g).toFixed(1)+'" y2="'+((h-24)-(h-40)*g).toFixed(1)+'" stroke="#e2ecf9" stroke-dasharray="3 4"/>').join("");
  return '<svg viewBox="0 0 '+w+' '+h+'" class="chart-wrap"><defs><linearGradient id="ag" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="'+color+'" stop-opacity=".32"/><stop offset="1" stop-color="'+color+'" stop-opacity="0"/></linearGradient></defs>'+grid+
    '<polygon points="26,'+(h-24)+' '+line+' '+(w-4)+','+(h-24)+'" fill="url(#ag)"/>'+
    '<polyline points="'+line+'" fill="none" stroke="'+color+'" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>'+dots+labs+'</svg>';
}
function donut(pct,color){
  const r=44,c=2*Math.PI*r;
  return '<svg viewBox="0 0 120 120" style="width:118px;height:118px"><circle cx="60" cy="60" r="'+r+'" fill="none" stroke="#e2ecf9" stroke-width="11"/><circle cx="60" cy="60" r="'+r+'" fill="none" stroke="'+color+'" stroke-width="11" stroke-linecap="round" stroke-dasharray="'+(c*pct/100).toFixed(1)+' '+c.toFixed(1)+'" transform="rotate(-90 60 60)"/><text x="60" y="57" text-anchor="middle" font-size="21" font-weight="800" fill="#0a2540">'+pct+'%</text><text x="60" y="74" text-anchor="middle" font-size="9.5" fill="#8ba0b6">综合满意度</text></svg>';
}
const pill=p=>'<span class="pill '+p[0]+'">'+p[1]+'</span>';
